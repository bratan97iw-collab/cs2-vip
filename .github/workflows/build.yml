name: Build AMBuild Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      HL2SDK_ROOT: ${{ github.workspace }}/external
      MMS_PATH: ${{ github.workspace }}/external/metamod-source
      MANIFEST_PATH: ${{ github.workspace }}/external/metamod-source/hl2sdk-manifests
      CC: clang-14
      CXX: clang++-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up build tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qy
          sudo apt-get install -y git clang-14 binutils python3 python3-pip protobuf-compiler zip
          python3 -m pip install --user --upgrade pip importlib-metadata
          python3 -m pip install --user setuptools==45.2.0
          git clone https://github.com/alliedmodders/ambuild.git
          python3 -m pip install --user ./ambuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch Metamod 1483 and HL2SDK
        run: |
          set -euxo pipefail
          mkdir -p external
          cd external
          git clone --recursive https://github.com/alliedmodders/metamod-source.git
          cd metamod-source
          git checkout 170058a
          git submodule update --init --recursive
          cd ..
          git clone --recursive --branch cs2 --single-branch https://github.com/alliedmodders/hl2sdk.git hl2sdk-cs2
          mkdir -p hl2sdk-cs2/devtools/bin/linuxsteamrt64
          ln -sf "$(command -v protoc)" hl2sdk-cs2/devtools/bin/linuxsteamrt64/protoc
          protoc --version
          # The original project expects SchemaEntity next to the repository.
          cd "$GITHUB_WORKSPACE/.."
          git clone https://github.com/pisex/SchemaEntity.git

      - name: Configure and build plugin
        run: |
          set -euxo pipefail
          mkdir -p build
          cd build
          python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize \
            --hl2sdk-manifests="$MANIFEST_PATH" \
            --mms_path="$MMS_PATH" --hl2sdk-root="$HL2SDK_ROOT"
          ambuild

      - name: Create archive
        run: |
          set -euxo pipefail
          cd build/package
          zip -r "$GITHUB_WORKSPACE/vip-linux.zip" addons

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: vip-linux-metamod1483
          path: vip-linux.zip
          if-no-files-found: error
