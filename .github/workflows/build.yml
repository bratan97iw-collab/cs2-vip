name: Build AMBuild Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      HL2SDK_ROOT: ${{ github.workspace }}/external
      MMS_PATH: ${{ github.workspace }}/external/metamod-source
      MANIFEST_PATH: ${{ github.workspace }}/external/metamod-source/hl2sdk-manifests
      CC: clang-14
      CXX: clang++-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up build tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qy
          sudo apt-get install -y git curl clang-14 binutils python3 python3-pip protobuf-compiler zip
          python3 -m pip install --user --upgrade pip importlib-metadata
          python3 -m pip install --user setuptools==45.2.0
          git clone https://github.com/alliedmodders/ambuild.git
          python3 -m pip install --user ./ambuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch Metamod 1483 and HL2SDK
        run: |
          set -euxo pipefail
          mkdir -p external
          cd external
          git clone --recursive https://github.com/alliedmodders/metamod-source.git
          cd metamod-source
          git checkout 170058a
          git submodule update --init --recursive
          cd ..
          git clone --recursive --branch cs2 --single-branch https://github.com/alliedmodders/s2sdk.git hl2sdk-cs2
          # The legacy VIP AMBuilder expects proto files in the old csgo folder.
          # Modern s2sdk stores those files under common/. Bridge only the
          # expected directory instead of copying files or modifying s2sdk.
          test -f hl2sdk-cs2/common/source2_steam_stats.proto
          mkdir -p hl2sdk-cs2/thirdparty/game_protobufs
          ln -s "$(pwd)/hl2sdk-cs2/common" hl2sdk-cs2/thirdparty/game_protobufs/csgo
          for name in valveextensions network_connection networkbasetypes netmessages source2_steam_stats; do
            if [ ! -f "hl2sdk-cs2/thirdparty/game_protobufs/csgo/${name}.proto" ]; then
              echo "Missing proto: ${name}.proto"
              find hl2sdk-cs2 -name "${name}.proto" -print
              exit 1
            fi
          done
          mkdir -p hl2sdk-cs2/devtools/bin/linuxsteamrt64
          ln -sf "$(command -v protoc)" hl2sdk-cs2/devtools/bin/linuxsteamrt64/protoc
          protoc --version
          # The original project expects SchemaEntity next to the repository.
          cd "$GITHUB_WORKSPACE/.."
          git clone https://github.com/pisex/SchemaEntity.git

      - name: Supply legacy SchemaEntity header (compatibility test)
        run: |
          set -euxo pipefail
          # SchemaEntity includes a header that s2sdk/cs2 no longer ships.
          # Bring in the original legacy declaration without changing s2sdk source files.
          SDK="$HL2SDK_ROOT/hl2sdk-cs2"
          mkdir -p "$SDK/public/tier1"
          curl --fail --location --show-error --silent \
            https://raw.githubusercontent.com/alliedmodders/hl2sdk/cs2/public/tier1/utlmap.h \
            --output "$SDK/public/tier1/utlmap.h"
          test -s "$SDK/public/tier1/utlmap.h"
          echo "Legacy utlmap.h supplied; further C++ incompatibilities may remain."

      - name: Adapt SchemaEntity schema field layout for S2SDK
        run: |
          set -euxo pipefail
          python3 - <<'PYSCHEMA'
          from pathlib import Path
          p = Path.cwd().parent / 'SchemaEntity' / 'schemasystem.cpp'
          src = p.read_text()
          replacements = {
              'm_nStaticMetadataCount': 'm_nNumMetadata',
              'm_pStaticMetadata': 'm_pMetadata',
              'm_pszName': 'm_pName',
              'm_nFieldCount': 'm_nNumFields',
              'm_nBaseClassCount': 'm_nNumBaseClasses',
          }
          for old, new in replacements.items():
              if old not in src:
                  raise SystemExit(f'Expected SchemaEntity field is missing: {old}')
              src = src.replace(old, new)
          p.write_text(src)
          print('Updated SchemaEntity schema field names for current S2SDK.')
          PYSCHEMA

      - name: Adapt legacy SchemaEntity types for S2SDK
        run: |
          set -euxo pipefail
          python3 - <<'PYTYPES'
          from pathlib import Path
          root = Path.cwd().parent / 'SchemaEntity'
          globaltypes = root / 'globaltypes.h'
          contents = globaltypes.read_text()
          # Types are defined by current S2SDK; use the real declarations.
          if '#include <mathlib/ray.h>' not in contents:
              contents = contents.replace('#include <platform.h>', '#include <platform.h>\n#include <mathlib/ray.h>\n#include <gametrace.h>', 1)
          globaltypes.write_text(contents)

          damage = root / 'ctakedamageinfo.h'
          contents = damage.read_text()
          if '#include <gametrace.h>' not in contents:
              contents = contents.replace('#include <platform.h>', '#include <platform.h>\n#include <gametrace.h>', 1)
          damage.write_text(contents)

          schema = root / 'schemasystem.cpp'
          contents = schema.read_text()
          if 'NetworkStateChanged_t' not in contents:
              raise SystemExit('SchemaEntity source changed; refusing to patch unknown version')
          contents = contents.replace('NetworkStateChanged_t', 'NetworkStateChangedData')
          schema.write_text(contents)
          print('Applied verified S2SDK type references to local SchemaEntity checkout')
          PYTYPES

      - name: Inspect S2SDK API compatibility
        run: |
          set -euxo pipefail
          SDK="$HL2SDK_ROOT/hl2sdk-cs2"
          echo "=== NetworkStateChangedData definition ==="
          sed -n '25,110p' "$SDK/public/entity2/entityinstance.h"
          echo "=== Current S2SDK type declarations ==="
          for type in 'Ray_t' 'RayType_t' 'CHitBox' 'HitGroup_t' 'NetworkStateChangedData'; do
            echo "=== $type ==="
            grep -RnE "(struct|class|enum|typedef|using)[[:space:]]+${type}\b|${type}[[:space:]]*\(" \
              "$SDK/public" "$SDK/common" --include='*.h' | head -25 || true
          done
          echo "=== Legacy SchemaEntity call sites ==="
          sed -n '195,235p' "$GITHUB_WORKSPACE/../SchemaEntity/schemasystem.cpp"
          sed -n '305,370p' "$GITHUB_WORKSPACE/../SchemaEntity/globaltypes.h"

      - name: Remove unused legacy SourceHook vector include
        run: |
          set -euxo pipefail
          python3 - <<'PYREMOVE'
          from pathlib import Path
          header = Path('vip.h')
          src = header.read_text()
          line = '#include <sh_vector.h>'
          if src.count(line) != 1:
              raise SystemExit('Expected legacy include not found exactly once in vip.h')
          src = src.replace(line, '// Legacy sh_vector.h removed: no SourceHook::CVector usage in VIP sources', 1)
          legacy_server = '#include <iserver.h>'
          if src.count(legacy_server) != 1:
              raise SystemExit('Expected legacy iserver.h include not found exactly once in vip.h')
          src = src.replace(legacy_server, '// Legacy iserver.h removed: IServerListener is declared in include/utils.h', 1)
          header.write_text(src)
          print('Removed legacy sh_vector.h and iserver.h headers from VIP Core')
          PYREMOVE

      - name: Configure and build plugin
        run: |
          set -euxo pipefail
          mkdir -p build
          cd build
          python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize \
            --hl2sdk-manifests="$MANIFEST_PATH" \
            --mms_path="$MMS_PATH" --hl2sdk-root="$HL2SDK_ROOT"
          echo "=== SDK SOURCE FILE DIAGNOSTICS ==="
          SDK="$HL2SDK_ROOT/hl2sdk-cs2"
          for file in \
            public/tier0/memoverride.cpp \
            public/networkvar.cpp \
            tier1/generichash.cpp \
            entity2/entitysystem.cpp \
            entity2/entityhandle.cpp \
            entity2/concreteentitylist.cpp \
            entity2/entityidentity.cpp \
            entity2/entitykeyvalues.cpp \
            entity2/entitypulse.cpp \
            entity2/entitypulsecallcontext.cpp \
            tier0_perproject/convar.cpp \
            tier0_perproject/convarref.cpp \
            tier0_perproject/concommandbase.cpp \
            kv3lib/keyvalues3.cpp; do
            if [ -f "$SDK/$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done
          echo "=== SEARCH FOR GENERICHASH ==="
          find "$SDK" -iname '*generichash*' -print
          echo "=== KHOOK HEADERS ==="
          KHOOK_INCLUDE="$MMS_PATH/third_party/khook/include"
          test -f "$KHOOK_INCLUDE/khook.hpp"
          export CPLUS_INCLUDE_PATH="$KHOOK_INCLUDE${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}"
          echo "KHook include path: $KHOOK_INCLUDE"
          echo "=== COMPILE ==="
          ambuild

      - name: Create archive
        run: |
          set -euxo pipefail
          cd build/package
          zip -r "$GITHUB_WORKSPACE/vip-linux.zip" addons

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: vip-linux-metamod1483
          path: vip-linux.zip
          if-no-files-found: error
